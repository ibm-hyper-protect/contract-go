apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  runtimeClassName: kata-cc
  initContainers:
  - name: init-setup
    image: quay.io/prometheus/busybox:latest
    command: ["/bin/sh"]
    args: ["-c", "echo 'Initializing...' && sleep 5"]
  containers:
  - name: main-app
    image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abcd
    command: ["/bin/bash"]
    args: ["-c", "echo 'Hello $USER' && cat /etc/hosts | grep localhost"]
    ports:
    - containerPort: 8080
